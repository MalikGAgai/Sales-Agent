services:
  nginx:
    image: nginx:1.25-alpine
    container_name: salesai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - salesai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: salesai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - salesai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salesai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-salesai}:${POSTGRES_PASSWORD:-salesai_password}@db:5432/${POSTGRES_DB:-salesai_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salesai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: salesai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesai_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesai} -d ${POSTGRES_DB:-salesai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - salesai-network

  redis:
    image: redis:7-alpine
    container_name: salesai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - salesai-network

volumes:
  postgres_data:
  redis_data:

networks:
  salesai-network:
    driver: bridge
